  field_body:
  - value: '<p>This is a sample news article created by the News recipe. It shows every part of a news item: the image at the top, the date, the article text, tags and the summary used on news cards.</p><h2>Add your own news</h2><p>Go to <strong>Content &gt; Add content &gt; News</strong>. Fill in the <strong>Basic Information</strong> tab, then add an image in the <strong>Media</strong> tab. The page address is built from the <strong>Page URL</strong> field.</p><p>When you are ready, edit or delete this article.</p>'
